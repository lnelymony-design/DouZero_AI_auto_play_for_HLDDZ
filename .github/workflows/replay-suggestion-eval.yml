name: Replay suggestion lambda evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/replay_fixtures/**"
      - "tools/evaluate_replay_suggestions.py"
      - "inference/**"
      - "douzero/**"
      - "baselines/resnet/**"
      - ".github/workflows/replay-suggestion-eval.yml"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.23.5" "GitPython>=3.1"
          pip install "torch==2.0.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Compare lambda values
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python tools/evaluate_replay_suggestions.py \
            tools/replay_fixtures/game_01.replay.json \
            tools/replay_fixtures/game_02.replay.json \
            tools/replay_fixtures/game_03.replay.json \
            --weights 0.30 0.40 0.45 0.49 \
            --samples 1000 \
            --min-ess 0.40 | tee lambda-eval.txt
      - name: Validate response risk against settlement truth
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          for mode in uniform pass full; do
            python tools/evaluate_replay_truth.py \
              tools/replay_fixtures/game_01.replay.json \
              tools/replay_fixtures/game_02.replay.json \
              tools/replay_fixtures/game_03.replay.json \
              --weights 0.30 0.40 0.45 0.49 \
              --samples 1600 \
              --max-candidates 3 \
              --behavior-mode "$mode" | tee "truth-$mode.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-eval
          path: |
            lambda-eval.txt
            truth-uniform.txt
            truth-pass.txt
            truth-full.txt
