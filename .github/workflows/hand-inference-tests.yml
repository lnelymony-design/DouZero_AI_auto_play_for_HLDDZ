name: Hand inference tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependency
        run: python -m pip install numpy
      - name: Run hand inference unit tests
        run: python -m unittest tests/test_hand_inference.py
