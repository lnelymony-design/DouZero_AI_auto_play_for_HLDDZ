name: Replay risk evaluation

on:
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    if: github.head_ref == 'feature/hand-inference-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.23.5
          python -m pip install torch==2.0.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compare lambda values on recorded games
        run: |
          python tools/evaluate_replay_suggestions.py \
            tests/replay_samples/game_174940.replay.json \
            tests/replay_samples/game_175111.replay.json \
            tests/replay_samples/game_175254.replay.json \
            --weights 0.20 0.30 0.40 \
            --samples 1000 \
            --min-ess 0.40 | tee replay_risk_eval.txt
      - name: Upload evaluation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-risk-eval
          path: replay_risk_eval.txt
